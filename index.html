<script>
(function () {
  function showError(message) {
    var root = document.getElementById('root');
    if (!root) return;
    root.innerHTML =
      '<div style="min-height:760px;background:#070e08;color:#ffb627;font:18px monospace;padding:24px;box-sizing:border-box;white-space:pre-wrap;">' +
      'Не удалось запустить симуляцию.\n\n' +
      message +
      '\n\nПроверьте, что Google Sites не заблокировал внешние скрипты React/ReactDOM и что сайт открыт в Preview/Published mode.' +
      '</div>';
  }

  window.addEventListener('error', function (event) {
    if (event && event.target && event.target.tagName === 'SCRIPT') {
      showError('Не загрузился внешний скрипт: ' + (event.target.src || 'unknown script'));
      return;
    }
    if (event && event.message) {
      showError(event.message);
    }
  }, true);

  window.addEventListener('unhandledrejection', function (event) {
    showError(event.reason && event.reason.message ? event.reason.message : String(event.reason));
  });
})();
</script>

.rx-context {
  background: #0b150b;
  border: 1px solid #174f1d;
  border-left: 3px solid #1c6b27;
  padding: 18px;
  color: #d4f5d4;
  font-size: 14px;
  line-height: 1.65;
  white-space: pre-wrap;
  box-shadow: inset 0 0 24px rgba(0,0,0,.35);
}
.rx-choices {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.rx-choice {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  background: #0b150b;
  border: 1px solid #174f1d;
  color: #b2dfdb;
  padding: 12px 14px;
  text-align: left;
  font: 14px/1.35 'VT323', monospace;
  cursor: pointer;
  transition: border-color .15s, color .15s, background .15s, transform .15s;
}
.rx-choice:hover {
  border-color: #3bff52;
  background: #0f1f0f;
  color: #d4f5d4;
  transform: translateX(2px);
}
.rx-key {
  min-width: 28px;
  padding: 4px 5px;
  border: 1px solid #ffb627;
  color: #ffb627;
  text-align: center;
  font-family: 'Press Start 2P', monospace;
  font-size: 9px;
  margin-top: 2px;
}
.rx-preview-note {
  border: 1px solid #174f1d;
  color: #3d6b40;
  background: rgba(11,21,11,.75);
  padding: 9px 12px;
  font-size: 16px;
  line-height: 1.35;
}
.rx-reaction {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 12px;
  flex: 1;
  min-height: 0;
}
.rx-reaction-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
}
.rx-reaction-title {
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(12px, 2vw, 17px);
  color: #ffb627;
  line-height: 1.6;
  letter-spacing: 2px;
  animation: rx-textIn .35s ease-out both;
}
.rx-chip {
  color: #1c6b27;
  border: 1px solid #174f1d;
  padding: 7px 9px;
  font-size: 15px;
  white-space: nowrap;
  background: #0b150b;
}
.rx-stage-wrap {
  border: 1px solid #174f1d;
  background: #071007;
  min-height: 340px;
  position: relative;
  overflow: hidden;
  box-shadow: inset 0 0 40px rgba(0,0,0,.5), 0 0 24px rgba(0,0,0,.25);
}
.rx-stage-wrap.choice-a { box-shadow: inset 0 0 40px rgba(0,0,0,.5), 0 0 26px rgba(255,182,39,.16); }
.rx-stage-wrap.choice-b { box-shadow: inset 0 0 40px rgba(0,0,0,.5), 0 0 24px rgba(59,255,82,.10); }
.rx-stage-wrap.choice-c { box-shadow: inset 0 0 40px rgba(0,0,0,.5), 0 0 28px rgba(255,182,39,.14); }
.rx-stage-wrap.choice-d { box-shadow: inset 0 0 40px rgba(0,0,0,.5), 0 0 28px rgba(59,196,255,.12); }
.rx-stage {
  width: 100%;
  height: 100%;
  min-height: 340px;
  display: block;
}
.rx-text-layer {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.rx-text-card {
  background: #0b150b;
  border: 1px solid #174f1d;
  border-left: 3px solid #1c6b27;
  padding: 12px 14px;
  color: #d4f5d4;
  font-size: 18px;
  line-height: 1.42;
  animation: rx-textIn .45s ease-out both;
}
.rx-text-card strong {
  display: block;
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  line-height: 1.7;
  letter-spacing: 1px;
  color: #ffb627;
  margin-bottom: 6px;
}
.rx-controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  border-top: 1px solid #174f1d;
  padding-top: 10px;
}
.rx-choice-tabs {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.rx-tab, .rx-btn {
  background: transparent;
  color: #3bff52;
  border: 1px solid #2a8f35;
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  padding: 10px 12px;
  cursor: pointer;
  letter-spacing: 1px;
}
.rx-tab.active {
  color: #070e08;
  background: #ffb627;
  border-color: #ffb627;
}
.rx-btn:hover, .rx-tab:hover {
  border-color: #3bff52;
  background: rgba(59,255,82,.06);
}
.rx-status {
  color: #1c6b27;
  font-size: 15px;
}
.pixel-text {
  font-family: 'Press Start 2P', monospace;
  paint-order: stroke;
  stroke: #071007;
  stroke-width: 2px;
}
.scene-a .cam { transform-origin: 450px 230px; animation: rx-cameraA 6.5s ease-out both; }
.pop { opacity: 0; transform-box: fill-box; transform-origin: center; animation: rx-popIn .45s ease-out forwards; }
.pop.d1 { animation-delay: .25s; } .pop.d2 { animation-delay: .55s; } .pop.d3 { animation-delay: .85s; }
.pop.d4 { animation-delay: 1.15s; } .pop.d5 { animation-delay: 1.45s; } .pop.d6 { animation-delay: 1.75s; }
.pop.d7 { animation-delay: 2.05s; } .pop.d8 { animation-delay: 2.35s; }
.draw { stroke-dasharray: 260; stroke-dashoffset: 260; animation: rx-drawLine 1.35s ease-out forwards; }
.draw.d1 { animation-delay: .45s; } .draw.d2 { animation-delay: .85s; } .draw.d3 { animation-delay: 1.25s; }
.draw.d4 { animation-delay: 1.65s; }
.pulse-amb { animation: rx-softPulse 1.15s ease-in-out infinite; }
.pulse-red { animation: rx-redSoftPulse 1.05s ease-in-out infinite; }
.scene-b .road { opacity: 0; animation: rx-cardToColumn .45s ease-out forwards; }
.scene-b .r1 { animation-delay: .3s; } .scene-b .r2 { animation-delay: .65s; } .scene-b .r3 { animation-delay: 1s; }
.scene-b .check { transform-box: fill-box; transform-origin: center; animation: rx-checkMark .6s ease-out .9s both; }
.scene-b .calm { animation: rx-calmLight 2.2s ease-in-out infinite; }
.scene-c .lock { transform-box: fill-box; transform-origin: center; animation: rx-lockClick .7s ease-out 1.2s both; }
.scene-c .connector { stroke-dasharray: 220; stroke-dashoffset: 220; animation: rx-drawLine 1.2s ease-out .55s forwards; }
.scene-d .cursor { animation: rx-cursorScan 4.6s ease-in-out infinite; }

.scene-d .row1 { animation: rx-rowBlink 1.4s ease-in-out infinite; }
.scene-d .row2 { animation: rx-rowBlink 1.4s ease-in-out infinite .3s; }
.scene-d .row3 { animation: rx-rowBlink 1.4s ease-in-out infinite .6s; }

@media (max-width: 780px) {
  .rx-choose-grid, .rx-text-layer { grid-template-columns: 1fr; }
  .rx-context { font-size: 18px; }
  .rx-reaction-head, .rx-controls { flex-direction: column; align-items: stretch; }
  .rx-chip { white-space: normal; }
}

/* ── ADDED: FINAL OCEAN DETAILS TABLE ── */
.ft-detail-screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  width: min(1120px, 100%);
  margin: 0 auto;
  padding: 16px;
  box-sizing: border-box;
  gap: 12px;
}
.ft-detail-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
  border-bottom: 1px solid #174f1d;
  padding-bottom: 10px;
}
.ft-detail-title {
  font-family: 'Press Start 2P', monospace;
  color: #ffb627;
  font-size: clamp(10px, 2vw, 14px);
  line-height: 1.75;
  letter-spacing: 1px;
  text-shadow: 0 0 10px rgba(255,182,39,.35);
}
.ft-detail-subtitle {
  color: #3d6b40;
  font-size: 16px;
  letter-spacing: 1px;
  line-height: 1.35;
}
.ft-detail-chip {
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  color: #3bff52;
  border: 1px solid #2a8f35;
  background: #0b150b;
  padding: 9px 10px;
  white-space: nowrap;
}
.ft-detail-panel {
  background: #0b150b;
  border: 1px solid #174f1d;
  box-shadow: inset 0 0 30px rgba(0,0,0,.38), 0 0 20px rgba(0,0,0,.22);
  overflow: auto;
  min-height: 0;
  flex: 1;
}
.ft-detail-table {
  width: 100%;
  min-width: 980px;
  border-collapse: collapse;
  color: #d4f5d4;
  font-size: 16px;
  line-height: 1.25;
}
.ft-detail-table th {
  position: sticky;
  top: 0;
  z-index: 1;
  background: #102010;
  color: #ffb627;
  font-family: 'Press Start 2P', monospace;
  font-size: 7px;
  letter-spacing: .5px;
  border-bottom: 1px solid #2a8f35;
  padding: 9px 8px;
  text-align: left;
}
.ft-detail-table td {
  border-bottom: 1px solid #123a14;
  border-right: 1px solid #123a14;
  padding: 8px;
  vertical-align: top;
}
.ft-detail-table tbody tr:nth-child(odd) td { background: rgba(15,63,18,.18); }
.ft-detail-table tbody tr:hover td { background: rgba(59,255,82,.055); }
.ft-detail-num {
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  color: #3bff52;
  white-space: nowrap;
}
.ft-detail-sit-title {
  color: #ffb627;
  letter-spacing: .5px;
}
.ft-detail-choice {
  color: #b2dfdb;
}
.ft-detail-choice-key {
  color: #070e08;
  background: #ffb627;
  border: 1px solid #ffb627;
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  padding: 3px 5px;
  margin-right: 6px;
  display: inline-block;
}
.ft-detail-score {
  text-align: center;
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  white-space: nowrap;
}
.ft-detail-score.pos { color: #3bff52; }
.ft-detail-score.neg { color: #ff5252; }
.ft-detail-score.zero { color: #3d6b40; }
.ft-detail-total-row td {
  position: sticky;
  bottom: 0;
  background: #102010 !important;
  border-top: 2px solid #ffb627;
  color: #ffb627;
}
.ft-detail-controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  border-top: 1px solid #174f1d;
  padding-top: 10px;
}
.ft-details-btn {
  border-color: #ffb627;
  color: #ffb627;
}
.ft-details-btn:hover {
  border-color: #ffb627;
  background: rgba(255,182,39,.08);
}
.ft-detail-note {
  color: #3d6b40;
  font-size: 15px;
  line-height: 1.35;
}
@media (max-width: 780px) {
  .ft-detail-head, .ft-detail-controls { flex-direction: column; align-items: stretch; }

/* ── ADDED: OCEAN PROFILE BIPOLAR ROW LAYOUT ── */
.ft-ocean-profile-left {
  width: 100%;
  max-width: 940px;
  gap: 18px;
  padding: 28px 30px 26px;
  box-sizing: border-box;
}

.ft-ocean-metric-row {
  display: grid;
  grid-template-columns: minmax(132px, .9fr) minmax(330px, 1.9fr) minmax(132px, .9fr);
  align-items: center;
  column-gap: 16px;
  width: 100%;
}

.ft-ocean-pole {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #6f5f82;
  font-size: 14px;
  line-height: 1.05;
  letter-spacing: .4px;
}

.ft-ocean-pole-neg {
  align-items: flex-end;
  text-align: right;
}

.ft-ocean-pole-pos {
  align-items: flex-start;
  text-align: left;
}

.ft-ocean-pole-sign {
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  line-height: 1;
  letter-spacing: 1px;
  opacity: .75;
  margin-bottom: 2px;
}

.ft-ocean-pole-neg .ft-ocean-pole-sign { color: #ff5252; }
.ft-ocean-pole-pos .ft-ocean-pole-sign { color: #3bff52; }

.ft-ocean-scale {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.ft-ocean-trait-head {
  display: grid;
  grid-template-columns: 42px minmax(0, 1fr) 86px;
  align-items: center;
  gap: 8px;
}

.ft-ocean-letter {
  font-family: 'Press Start 2P', monospace;
  font-size: 10px;
  color: #ffb627;
  text-align: center;
  line-height: 1;
}

.ft-ocean-metric-name {
  font-family: 'Press Start 2P', monospace;
  color: #d4f5d4;
  font-size: clamp(7px, 1.15vw, 10px);
  line-height: 1.55;
  text-align: center;
  white-space: nowrap;
  letter-spacing: 1px;
  text-transform: uppercase;
  text-shadow: 0 0 8px rgba(59,255,82,.25);
}

.ft-ocean-bar-left {
  width: 100%;
  height: 18px;
  justify-self: stretch;
  overflow: visible;
  border-color: #1c6b27;
  background:
    linear-gradient(90deg, rgba(255,82,82,.13) 0%, rgba(255,82,82,.04) 48%, rgba(255,182,39,.16) 50%, rgba(59,255,82,.04) 52%, rgba(59,255,82,.13) 100%),
    #0f1f0f;
  box-shadow: inset 0 0 14px rgba(0,0,0,.42);
}

.ft-ocean-bar-left::before {
  content: '';
  position: absolute;
  top: -5px;
  bottom: -5px;
  left: 50%;
  width: 2px;
  transform: translateX(-50%);
  background: #ffb627;
  box-shadow: 0 0 8px rgba(255,182,39,.65);
  pointer-events: none;
}

.ft-ocean-bar-left::after {
  content: '0';
  position: absolute;
  top: 50%;
  bottom: auto;
  left: 50%;
  width: auto;
  min-width: 18px;
  transform: translate(-50%, -50%);
  background: #070e08;
  border: 1px solid #174f1d;
  color: #3d6b40;
  font-family: 'Press Start 2P', monospace;
  font-size: 7px;
  line-height: 12px;
  text-align: center;
  pointer-events: none;
  z-index: 3;
}

.ft-ocean-bar-fill {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 0;
  background: var(--ocean-color);
  box-shadow: 0 0 8px var(--ocean-color), inset 0 0 10px rgba(255,255,255,.08);
  transition: width 1.1s ease-out;
  z-index: 2;
}

.ft-ocean-bar-fill::after {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(90deg, transparent 0 5px, rgba(7,14,8,.34) 5px 6px);
  pointer-events: none;
}

.ft-ocean-bar-fill::before {
  content: '';
  position: absolute;
  top: 50%;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 2px solid var(--ocean-color);
  background: #070e08;
  box-shadow: 0 0 10px var(--ocean-color);
  transform: translateY(-50%);
}

.ft-ocean-bar-fill.pos {
  left: 50%;
  background: linear-gradient(90deg, rgba(7,14,8,.12), var(--ocean-color));
}

.ft-ocean-bar-fill.pos::before { right: -11px; }

.ft-ocean-bar-fill.neg {
  right: 50%;
  background: linear-gradient(90deg, var(--ocean-color), rgba(7,14,8,.12));
}

.ft-ocean-bar-fill.neg::before { left: -11px; }

.ft-ocean-bar-fill.zero { display: none; }

.ft-ocean-score-value {
  font-family: 'Press Start 2P', monospace;
  font-size: 12px;
  line-height: 1;
  text-align: right;
  white-space: nowrap;
}

@media (max-width: 780px) {
  .ft-ocean-profile-left {
    max-width: 100%;
    padding: 24px 14px 20px;
    gap: 16px;
  }

  .ft-ocean-metric-row {
    grid-template-columns: 96px minmax(0, 1fr) 96px;
    column-gap: 8px;
  }

  .ft-ocean-pole {
    font-size: 16px;
    letter-spacing: 0;
  }

  .ft-ocean-pole-sign {
    font-size: 7px;
  }

  .ft-ocean-trait-head {
    grid-template-columns: 30px minmax(0, 1fr) 58px;
    gap: 5px;
  }

  .ft-ocean-letter,
  .ft-ocean-score-value {
    font-size: 8px;
  }

  .ft-ocean-metric-name {
    font-size: 7px;
    letter-spacing: .3px;
  }

  .ft-ocean-bar-left {
    height: 16px;
  }
}
